spring: { application: { name: drought-service }, datasource: { url: '${DROUGHT_DB_URL:jdbc:mysql://localhost:3306/dpdms_drought}', username: '${MYSQL_USER:root}', password: '${MYSQL_PASSWORD:}' }, jpa: { hibernate: { ddl-auto: validate } }, sql: { init: { mode: always } } }
server: { port: 8082 }
eureka: { client: { service-url: { defaultZone: '${EUREKA_URL:http://localhost:8761/eureka/}' } } }
dpdms: { hazard: { code: DROUGHT, required-indicators: [rainfallDeficitMm, consecutiveDryDays, cropFailurePercentage, peopleWaterShortage, livestockMortalityCount] } }
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
