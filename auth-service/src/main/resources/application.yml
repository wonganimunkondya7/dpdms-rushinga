spring: { application: { name: auth-service }, datasource: { url: '${AUTH_DB_URL:jdbc:mysql://localhost:3306/dpdms_auth}', username: '${MYSQL_USER:root}', password: '${MYSQL_PASSWORD:}' }, jpa: { hibernate: { ddl-auto: validate } }, sql: { init: { mode: always } } }
server: { port: 8086 }
eureka: { client: { service-url: { defaultZone: '${EUREKA_URL:http://localhost:8761/eureka/}' } } }

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
