<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPDMS Dashboard</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:16px system-ui;background:#f5f7f8;color:#152a34}header{padding:20px 6%;background:#075b4c;color:white}main{padding:24px 6%;display:grid;gap:20px}.cards{display:flex;gap:12px;flex-wrap:wrap}.card,form{background:white;padding:16px;border-radius:8px;box-shadow:0 1px 4px #bbb;min-width:145px}input,button{padding:8px;margin:3px}#map{height:420px;background:#ddd}.note{font-size:.9rem;color:#4a5d63}</style></head><body><header><h1>Rushinga Disaster Monitoring</h1><p>Approved incidents only - national read-only view</p></header><main><form id="login"><b>National login</b><input id="username" value="national@dpdms.local"><input id="password" type="password" placeholder="Password"><button>Sign in</button><span id="message"></span></form><section class="cards" id="cards"></section><section><h2>Live incident map</h2><div id="map"></div><p class="note">Only approved incidents are shown.</p></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const m=L.map('map').setView([-16.78,32.31],8);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let r=await fetch('http://localhost:8080/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(!r.ok){message.textContent='Login failed';return}localStorage.dpdmsToken=(await r.json()).token;location.reload()};const token=localStorage.dpdmsToken;const hazards=['flood','drought','fire','zoonotic','mining'];Promise.all(hazards.map(h=>fetch(`http://localhost:8080/${h}/api/incidents`,{headers:{Authorization:`Bearer ${token||''}`}}).then(r=>r.ok?r.json():[]).then(x=>({h,x})))).then(all=>{cards.innerHTML=all.map(({h,x})=>`<div class="card"><b>${h.toUpperCase()}</b><br>${x.length} approved</div>`).join('');all.flatMap(a=>a.x.map(x=>({...x,h:a.h}))).forEach(x=>L.marker([x.latitude,x.longitude]).addTo(m).bindPopup(`<b>${x.h}</b><br>${x.ward}<br>${x.severity}`));});</script></body></html>
